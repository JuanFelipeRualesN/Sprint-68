name: Base API MED RD Pipeline

trigger:
  branches:
    include:
      - main
   
pool:
  vmImage: 'ubuntu-latest'

  # name: 'MSJ-Agents'
  # demands:
  #   - Agent.Name -equals ubuntu-dev-agent

extends:
  template: azure-pipelines-template.yml
  parameters:
    ${{ if eq(variables['Build.SourceBranchName'], 'main') }}:
      azureAppService: 'app-apis-medrd-prod-eastus-001'
      azureSubscription: 'Require Testing Subscription'
      buildConfiguration: 'Release'
      projectEnvironment: 'med-rd'